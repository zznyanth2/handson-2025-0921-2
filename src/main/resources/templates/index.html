<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ToDo App</title>
    <script src="/static/js/dnd.js"></script>
    <style>
        .column { float:left; width:32%; padding:8px; border:1px solid #ccc; min-height:200px; }
        .todo { padding:6px; margin:4px; background:#f6f6f6; border:1px solid #ddd; cursor:grab; }
        .clearfix::after { content: ""; clear: both; display: table; }
    </style>
</head>
<body>
<h1>ToDo</h1>
<div>
    <form th:action="@{/api/todos}" method="post" id="createForm">
        <input type="text" name="title" placeholder="Title" required />
        <button type="submit">Create</button>
    </form>
</div>
<div class="clearfix">
    <div class="column" id="col-todo">
        <h3>TODO</h3>
        <div th:each="t : ${todosTodo}" class="todo" th:id="${t.id}" draggable="true"> 
            <strong th:text="${t.title}"></strong><br/>
            <small th:text="${t.description}"></small>
        </div>
    </div>
    <div class="column" id="col-doing">
        <h3>DOING</h3>
        <div th:each="t : ${todosDoing}" class="todo" th:id="${t.id}" draggable="true"> 
            <strong th:text="${t.title}"></strong><br/>
            <small th:text="${t.description}"></small>
        </div>
    </div>
    <div class="column" id="col-completed">
        <h3>COMPLETED</h3>
        <div th:each="t : ${todosCompleted}" class="todo" th:id="${t.id}" draggable="true"> 
            <strong th:text="${t.title}"></strong><br/>
            <small th:text="${t.description}"></small>
        </div>
    </div>
</div>

</body>
</html>
